<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | NOVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#18211f; --muted:#60716c; --lime:#b9f43d; --line:#dce4df; --paper:#f7faf8; --coral:#ff725e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); background:linear-gradient(135deg,#dff5e6 0 42%,var(--paper) 42%); font-family:"DM Sans",sans-serif; }
    .panel { width:min(430px,calc(100% - 32px)); padding:32px; background:#fff; border:1px solid var(--line); box-shadow:0 18px 45px rgba(28,51,41,.1); }
    .logo { display:flex; gap:8px; align-items:center; color:var(--ink); text-decoration:none; font:700 23px "Space Grotesk"; letter-spacing:1px; margin-bottom:38px; }
    .mark { width:18px; height:18px; background:var(--lime); border-radius:50% 50% 50% 3px; transform:rotate(45deg); }
    .eyebrow { color:#32705a; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; }
    h1 { margin:13px 0 8px; font:700 38px/1 "Space Grotesk"; }
    p { color:var(--muted); line-height:1.5; font-size:14px; }
    label { display:block; margin:20px 0 7px; font-size:13px; font-weight:700; }
    input { width:100%; padding:13px 12px; border:1px solid var(--line); font:inherit; outline-color:#398363; }
    button { width:100%; margin-top:22px; border:0; padding:15px; background:var(--coral); color:#fff; font-weight:700; cursor:pointer; }
    .result { min-height:18px; margin:12px 0 0; color:#b64c3e; }
    .back { display:block; margin-top:22px; color:#32705a; font-size:13px; font-weight:700; text-decoration:none; text-align:center; }
  </style>
</head>
<body>
  <main class="panel"><a class="logo" href="index.html"><span class="mark"></span>NOVA <small style="font:600 11px 'DM Sans';letter-spacing:0;color:var(--muted)">PRIVATE ADMIN</small></a><div class="eyebrow">NOVA Control Room</div><h1>Đăng nhập quản trị.</h1><p>Khu vực riêng để quản lý sản phẩm, tài khoản, đơn hàng và hỗ trợ khách hàng.</p><form id="admin-login-form"><label for="username">Email admin</label><input id="username" type="email" required autocomplete="username" placeholder="admin@gmail.com"><label for="password">Mật khẩu</label><input id="password" required type="password" autocomplete="current-password" placeholder="Mật khẩu admin"><button type="submit">Vào Control Room</button><p class="result" id="result"></p></form><a class="back" href="index.html">Về cửa hàng NOVA</a></main>
  <script>
    const form = document.querySelector('#admin-login-form');
    form.addEventListener('submit', async event => { event.preventDefault(); const result = document.querySelector('#result'); try { const response = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username:document.querySelector('#username').value.trim(), password:document.querySelector('#password').value }) }); const payload = await response.json(); if (!response.ok) { result.textContent = payload.error; return; } window.location.href = 'admin.html'; } catch (error) { result.textContent = 'Không kết nối được server. Hãy chạy start.ps1.'; } });
  </script>
</body>
</html>

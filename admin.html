<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#18211f; --muted:#60716c; --mint:#dff5e6; --lime:#b9f43d; --line:#dce4df; --paper:#f7faf8; --coral:#ff725e; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"DM Sans",sans-serif; }
    button, input, textarea { font:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1240px, calc(100% - 40px)); margin:auto; }
    header { padding:24px 0; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .logo { display:flex; gap:8px; align-items:center; color:var(--ink); text-decoration:none; font:700 23px "Space Grotesk"; letter-spacing:1px; }
    .logo-mark { width:18px; height:18px; background:var(--lime); border-radius:50% 50% 50% 3px; transform:rotate(45deg); }
    .header-actions { display:flex; gap:12px; align-items:center; }
    .button { border:0; padding:11px 15px; background:var(--ink); color:var(--white); font-weight:700; border-radius:3px; }
    .button.alt { background:var(--white); color:var(--ink); border:1px solid var(--line); }
    .hero { padding:56px 0 28px; display:flex; justify-content:space-between; align-items:end; gap:24px; }
    .eyebrow { color:#32705a; text-transform:uppercase; letter-spacing:1.2px; font-size:12px; font-weight:700; }
    h1, h2, h3 { font-family:"Space Grotesk"; }
    h1 { font-size:clamp(38px, 5vw, 68px); line-height:.98; margin:12px 0 0; }
    .hero p { max-width:400px; color:var(--muted); line-height:1.6; }
    .tabs { display:flex; gap:8px; border-bottom:1px solid var(--line); margin-top:24px; }
    .tab { border:0; padding:14px 4px; margin-right:20px; background:transparent; color:var(--muted); font-weight:700; border-bottom:2px solid transparent; }
    .tab.active { color:var(--ink); border-color:var(--coral); }
    .panel { padding:28px 0 70px; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:18px; }
    .panel-head h2 { margin:0; font-size:28px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); background:var(--white); }
    table { width:100%; min-width:760px; border-collapse:collapse; }
    th, td { padding:15px 16px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
    th { background:var(--ink); color:var(--white); font-size:12px; letter-spacing:.5px; text-transform:uppercase; }
    td small { display:block; color:var(--muted); margin-top:5px; line-height:1.4; }
    .actions { display:flex; gap:7px; }
    .icon-action { border:1px solid var(--line); background:var(--white); padding:7px 10px; color:var(--ink); font-weight:700; }
    .icon-action.delete { color:#bb4536; }
    .status { display:inline-block; padding:5px 8px; background:var(--mint); color:#286b50; font-size:11px; font-weight:700; }
    .empty { padding:35px; color:var(--muted); text-align:center; }
    .modal-backdrop { position:fixed; inset:0; display:none; place-items:center; padding:18px; background:rgba(13,26,21,.45); z-index:4; }
    .modal-backdrop.show { display:grid; }
    .modal { width:min(560px, 100%); max-height:calc(100vh - 36px); overflow:auto; padding:28px; background:var(--white); }
    .modal-head { display:flex; justify-content:space-between; align-items:start; }
    .modal h2 { margin:0; }
    .close { border:0; background:transparent; font-size:25px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:22px; }
    .field { display:grid; gap:6px; }
    .field.full { grid-column:1 / -1; }
    label { font-size:12px; font-weight:700; }
    input, textarea { width:100%; border:1px solid var(--line); padding:12px; color:var(--ink); outline-color:#398363; }
    textarea { min-height:92px; resize:vertical; }
    .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .notice { min-height:20px; margin:15px 0 0; color:#247150; font-size:13px; }
    @media (max-width:680px) { .shell { width:min(100% - 28px, 600px); } header, .hero, .panel-head { align-items:flex-start; flex-direction:column; } .header-actions { width:100%; justify-content:space-between; }.form-grid { grid-template-columns:1fr; }.field.full { grid-column:auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="logo" href="index.html"><span class="logo-mark"></span>NOVA <span style="font-size:12px;color:var(--muted);letter-spacing:0">CONTROL ROOM · ACCOUNTS</span></a>
      <div class="header-actions"><button class="button alt" id="refresh-button">Làm mới dữ liệu</button><button class="button alt" id="logout-button">Đăng xuất admin</button><a class="button" href="index.html">Về cửa hàng</a></div>
    </header>
    <section class="hero"><div><div class="eyebrow">NOVA Care / vận hành</div><h1>Điều khiển<br>nhịp bán hàng.</h1></div><p>Quản lý sản phẩm, theo dõi đơn đặt trước và tiếp nhận yêu cầu hỗ trợ trong một không gian gọn gàng, cùng ngôn ngữ thiết kế với cửa hàng NOVA.</p></section>
    <nav class="tabs" aria-label="Các mục quản trị"><button class="tab active" data-tab="products">Sản phẩm</button><button class="tab" data-tab="orders">Đơn hàng</button><button class="tab" data-tab="support">Hỗ trợ</button><button class="tab" data-tab="customers">Tài khoản</button></nav>
    <main class="panel" id="panel"></main>
  </div>
  <div class="modal-backdrop" id="product-modal"><form class="modal" id="product-form"><div class="modal-head"><div><div class="eyebrow">Kho sản phẩm</div><h2 id="modal-title">Thêm sản phẩm</h2></div><button class="close" type="button" id="modal-close" aria-label="Đóng">×</button></div><div class="form-grid"><div class="field"><label for="product-name">Tên sản phẩm</label><input id="product-name" required></div><div class="field"><label for="product-brand">Thương hiệu</label><input id="product-brand" required></div><div class="field"><label for="product-price">Giá bán</label><input id="product-price" type="number" min="0" required></div><div class="field"><label for="product-stock">Tồn kho</label><input id="product-stock" type="number" min="0" required></div><div class="field full"><label for="product-image">Đường dẫn hình ảnh</label><input id="product-image" type="url" placeholder="https://..."></div><div class="field full"><label for="product-description">Mô tả ngắn</label><textarea id="product-description" required></textarea></div></div><p class="notice" id="form-notice"></p><div class="form-actions"><button class="button alt" type="button" id="modal-cancel">Hủy</button><button class="button" type="submit">Lưu sản phẩm</button></div></form></div>
  <script>
    const panel = document.querySelector('#panel');
    const modal = document.querySelector('#product-modal');
    const form = document.querySelector('#product-form');
    let activeTab = 'products';
    let editingId = null;
    let products = [];
    const money = value => new Intl.NumberFormat('vi-VN').format(value) + 'đ';
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    async function request(url, options) { const response = await fetch(url, options); if (response.status === 401) { window.location.href = 'admin-login.html'; throw new Error('Phiên admin đã hết hạn.'); } if (!response.ok) throw new Error((await response.json()).error || 'Có lỗi kết nối.'); return response.json(); }
    async function loadTab(tab = activeTab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(button => button.classList.toggle('active', button.dataset.tab === activeTab));
      if (activeTab === 'products') products = await request('/api/products');
      const rows = activeTab === 'products' ? products : await request('/api/' + activeTab);
      render(rows);
    }
    function render(rows) {
      if (activeTab === 'products') { panel.innerHTML = `<div class="panel-head"><h2>Kho sản phẩm</h2><button class="button" id="add-product">+ Thêm sản phẩm</button></div><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Thương hiệu</th><th>Giá</th><th>Tồn kho</th><th>Thao tác</th></tr></thead><tbody>${rows.length ? rows.map(product => `<tr><td><strong>${escapeHtml(product.name)}</strong><small>${escapeHtml(product.description)}</small></td><td>${escapeHtml(product.brand)}</td><td>${money(product.price)}</td><td><span class="status">${product.stock} máy</span></td><td><div class="actions"><button class="icon-action" data-edit="${product.id}">Sửa</button><button class="icon-action delete" data-delete="${product.id}">Xóa</button></div></td></tr>`).join('') : '<tr><td colspan="5" class="empty">Chưa có sản phẩm.</td></tr>'}</tbody></table></div>`; document.querySelector('#add-product').addEventListener('click', () => openModal()); return; }
      const isOrders = activeTab === 'orders';
      if (activeTab === 'customers') { panel.innerHTML = `<div class="panel-head"><h2>Tài khoản đã đăng ký</h2><button class="button alt" id="tab-refresh">Làm mới</button></div><div class="table-wrap"><table><thead><tr><th>Khách hàng</th><th>Email</th><th>Số điện thoại</th><th>Ngày đăng ký</th></tr></thead><tbody>${rows.length ? rows.map(row => `<tr><td><strong>${escapeHtml(row.name)}</strong><small>Mã tài khoản: #${row.id}</small></td><td>${escapeHtml(row.email)}</td><td>${escapeHtml(row.phone) || 'Chưa cập nhật'}</td><td>${new Date(row.created_at).toLocaleString('vi-VN')}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Chưa có tài khoản đăng ký.</td></tr>'}</tbody></table></div>`; document.querySelector('#tab-refresh').addEventListener('click', () => loadTab()); return; }
      panel.innerHTML = `<div class="panel-head"><h2>${isOrders ? 'Đơn đặt trước' : 'Yêu cầu hỗ trợ'}</h2><button class="button alt" id="tab-refresh">Làm mới</button></div><div class="table-wrap"><table><thead><tr>${isOrders ? '<th>Khách hàng</th><th>Sản phẩm</th><th>Tổng tiền</th><th>Trạng thái</th>' : '<th>Khách hàng</th><th>Chủ đề</th><th>Nội dung</th><th>Trạng thái</th>'}</tr></thead><tbody>${rows.length ? rows.map(row => isOrders ? `<tr><td><strong>${escapeHtml(row.customer_name)}</strong><small>${escapeHtml(row.phone)}</small></td><td>${escapeHtml(row.product_name)}<small>Số lượng: ${row.quantity}</small></td><td>${money(row.total_amount)}</td><td><span class="status">${escapeHtml(row.status)}</span></td></tr>` : `<tr><td><strong>${escapeHtml(row.name)}</strong><small>${escapeHtml(row.phone)}</small></td><td>${escapeHtml(row.topic)}</td><td>${escapeHtml(row.message)}</td><td><span class="status">${escapeHtml(row.status)}</span></td></tr>`).join('') : '<tr><td colspan="4" class="empty">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>`; document.querySelector('#tab-refresh').addEventListener('click', () => loadTab());
    }
    function openModal(product = null) { editingId = product?.id || null; document.querySelector('#modal-title').textContent = editingId ? 'Sửa sản phẩm' : 'Thêm sản phẩm'; document.querySelector('#product-name').value = product?.name || ''; document.querySelector('#product-brand').value = product?.brand || ''; document.querySelector('#product-price').value = product?.price || ''; document.querySelector('#product-stock').value = product?.stock || ''; document.querySelector('#product-image').value = product?.image_url || ''; document.querySelector('#product-description').value = product?.description || ''; document.querySelector('#form-notice').textContent = ''; modal.classList.add('show'); document.querySelector('#product-name').focus(); }
    function closeModal() { modal.classList.remove('show'); }
    document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => loadTab(button.dataset.tab)));
    document.querySelector('#refresh-button').addEventListener('click', () => loadTab());
    document.querySelector('#logout-button').addEventListener('click', async () => { await fetch('/api/admin/logout', { method:'POST' }); window.location.href = 'admin-login.html'; });
    document.querySelector('#modal-close').addEventListener('click', closeModal); document.querySelector('#modal-cancel').addEventListener('click', closeModal); modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
    panel.addEventListener('click', async event => { const edit = event.target.closest('[data-edit]'); const remove = event.target.closest('[data-delete]'); if (edit) openModal(products.find(product => product.id === Number(edit.dataset.edit))); if (remove && confirm('Xóa sản phẩm này khỏi kho?')) { await request('/api/products/' + remove.dataset.delete, { method:'DELETE' }); await loadTab(); } });
    form.addEventListener('submit', async event => { event.preventDefault(); const data = { name: document.querySelector('#product-name').value.trim(), brand: document.querySelector('#product-brand').value.trim(), price: Number(document.querySelector('#product-price').value), stock: Number(document.querySelector('#product-stock').value), image_url: document.querySelector('#product-image').value.trim(), description: document.querySelector('#product-description').value.trim() }; const url = editingId ? '/api/products/' + editingId : '/api/products'; await request(url, { method: editingId ? 'PUT' : 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(data) }); closeModal(); await loadTab(); });
    loadTab().catch(error => { panel.innerHTML = `<p class="empty">${escapeHtml(error.message)} Hãy chạy website qua <strong>start.ps1</strong> để API hoạt động.</p>`; });
  </script>
</body>
</html>

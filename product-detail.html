  <style>
    :root { --ink:#18211f; --muted:#60716c; --mint:#cbf3dc; --lime:#b9f43d; --line:#dce4df; --paper:#f7faf8; --coral:#ff725e; --green:#32705a; }

    .button { display:inline-flex; align-items:center; gap:8px; border:0; border-radius:3px; padding:14px 18px; background:var(--coral); color:#fff; font-weight:700; text-decoration:none; cursor:pointer; }

    .not-found { padding:100px 0; text-align:center; }.not-found h1 { font-size:48px; }
    @media (max-width:760px) { .wrap { width:min(100% - 32px, 600px); } nav { height:66px; }.hero { grid-template-columns:1fr; gap:35px; padding:48px 0 60px; }.hero-image { height:390px; max-width:310px; margin:auto; }.spec-grid { grid-template-columns:1fr 1fr; }.feature-grid, .usage, .insight-grid, .warranty-grid { grid-template-columns:1fr; }.detail-grid { grid-template-columns:1fr; }.accordion-list { grid-template-columns:1fr; }.accordion-trigger { padding:18px 15px; font-size:16px; }.accordion-row { padding:14px 15px; }.review-summary, .review-fields { grid-template-columns:1fr; }.review-field.full { grid-column:span 1; }.review-score { border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px; }.section { padding:55px 0; } }
  </style>

    function makeDeepProfile(model, product) {
      const detail = extraDetails[model] || [];
      return { title:`Phân tích sâu ${product.name}`, overview:`${product.name} tập trung vào ${product.features.map(feature => feature[0].toLowerCase()).join(', ')}. Phần phân tích này giúp bạn hiểu chiếc máy phù hợp với nhu cầu nào, dùng thực tế ra sao và cần cân nhắc điều gì trước khi mua.`, rows:[['Hiệu năng thực tế',`${product.specs[1][1]}. Phù hợp với ${product.trends.join(', ').toLowerCase()}. Khi chạy tác vụ nặng, hiệu năng còn phụ thuộc vào nhiệt độ môi trường, phiên bản bộ nhớ và ứng dụng sử dụng.`],['Màn hình',`${product.specs[0][1]}. Đây là điểm quyết định trải nghiệm khi đọc nội dung, xem video, chơi game và sử dụng ngoài trời.`],['Camera',`${product.specs[2][1]}. Hệ thống camera hướng tới ${product.trends[0].toLowerCase()}, đồng thời nên kiểm tra điều kiện ánh sáng và chế độ chụp khi so sánh ảnh thực tế.`],['Pin và sạc',`${product.specs[3][1]}. Thời lượng sử dụng thay đổi theo độ sáng màn hình, 5G, game, camera và số lượng ứng dụng chạy nền.`],['Phần mềm và tiện ích',`${detail.find(([label]) => label === 'Hệ điều hành')?.[1] || 'Hệ điều hành theo từng hãng'}; ${product.features[1][0]} hỗ trợ ${product.features[1][1].toLowerCase()}`],['Độ bền và sử dụng lâu dài',`${detail.find(([label]) => label === 'Độ bền')?.[1] || 'Nên dùng thêm ốp và kính bảo vệ'}. Kiểm tra chính sách bảo hành, thời gian cập nhật phần mềm và linh kiện tại nơi mua.`]], package:[`Điện thoại ${product.name}`,'Cáp sạc USB-C hoặc phụ kiện sạc theo từng hãng','Que chọc SIM và tài liệu hướng dẫn','Ốp bảo vệ hoặc phụ kiện theo từng phiên bản'], note:`Thông số, bộ nhớ, phụ kiện và tính năng có thể khác theo quốc gia hoặc nhà phân phối. Hãy kiểm tra đúng phiên bản ${product.price256} trước khi đặt mua.` };
    }
    function makeReviews(model, product) {
      const reviewSets = {
        redmi14pro: [['DUY Thọ','Rất ưng. Nhân viên nhiệt tình. Camera chụp đủ sáng rất chi tiết, sạc nhanh là điểm mình thích nhất.'],['Minh K.','Màn hình đẹp, xem phim và dùng ngoài trời khá ổn. Máy hơi nặng nhưng đổi lại pin tốt.']],
        iphone16pro: [['Hoàng Nam','Camera Pro và video rất ổn định, máy chạy mượt khi chỉnh ảnh.'],['Lan Anh','Màn hình đẹp, hoàn thiện chắc tay. Phù hợp nếu đã dùng hệ sinh thái Apple.']],
        oneplus13: [['Tuấn Anh','Máy phản hồi nhanh, pin lớn và sạc nhanh. Chơi game lâu vẫn cần để ý nhiệt độ.'],['Mai Phương','Màn hình mượt, camera chân dung đẹp và giao diện dễ làm quen.']]
      };
      const reviews = reviewSets[model] || [['Khách hàng NOVA','Thiết kế đẹp, trải nghiệm phù hợp với nhu cầu hằng ngày và hiệu năng ổn định.'],['Người dùng đã mua','Thông số nổi bật đúng với phân khúc. Nên chọn dung lượng phù hợp trước khi đặt hàng.']];
      const submitted = JSON.parse(localStorage.getItem(`novaReviews:${model}`) || '[]');
      return { score: model === 'redmi14pro' ? '4.9' : '4.7', count: model === 'redmi14pro' ? '27k' : '124', reviews: [...submitted, ...reviews] };
    }
    function makeWarranty(product) {
      const terms = product.brand === 'Apple' ? '12 tháng theo chính sách Apple và trung tâm ủy quyền.' : product.brand === 'Samsung' ? '12 tháng chính hãng; thời hạn có thể thay đổi theo nhà phân phối.' : product.brand === 'NOVA' ? '24 tháng tại NOVA Care.' : '12 tháng chính hãng tại hệ thống phân phối.';
      return { terms, support:'Kiểm tra máy, tiếp nhận lỗi phần cứng và hướng dẫn cập nhật phần mềm.', process:'Liên hệ NOVA Care, cung cấp hóa đơn hoặc thông tin đơn hàng, sau đó gửi máy theo hướng dẫn kỹ thuật viên.', covered:['Lỗi phần cứng do nhà sản xuất','Màn hình, bo mạch và pin theo điều kiện bảo hành','Hỗ trợ kiểm tra phần mềm và khôi phục cài đặt'], excluded:['Rơi vỡ, cong máy, vào nước ngoài điều kiện công bố','Trầy xước hoặc hao mòn tự nhiên','Tự ý sửa chữa, thay linh kiện không chính hãng'] };
    }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character])); }
    const model = new URLSearchParams(window.location.search).get('model');
    const product = products[model];
    const deepProfile = product && (deepProfiles[model] || makeDeepProfile(model, product));
    const detail = document.querySelector('#detail');
    if (!product) { detail.innerHTML = '<div class="wrap not-found"><h1>Không tìm thấy sản phẩm</h1><p>Mẫu điện thoại này không còn trong danh mục.</p><a class="button secondary" href="index.html">Về trang sản phẩm</a></div>'; }
    else {
      document.title = `${product.name} | NOVA`;
      detail.innerHTML = `<section class="wrap hero"><img class="hero-image" src="${product.image}" alt="${product.name}"><div class="hero-copy"><div class="eyebrow">${product.brand} · Chi tiết sản phẩm</div><h1>${product.title}</h1><p>${product.description}</p><div class="price">Từ ${product.price}</div><div class="actions"><a class="button" href="index.html#dat-hang">Chọn máy và mua hàng <i data-lucide="arrow-up-right" size="18"></i></a><a class="button secondary" href="index.html">Xem các mẫu khác</a></div></div></section><section class="section"><div class="wrap"><h2>Thông số chính</h2><div class="spec-grid">${product.specs.map(([label,value,icon]) => `<article class="spec"><i data-lucide="${icon}"></i><b>${value}</b><span>${label}</span></article>`).join('')}</div></div></section><section class="section"><div class="wrap"><h2>Khám phá thông tin sản phẩm</h2><div class="accordion">${detailSections(model, product).map(([title, rows], index) => `<article class="accordion-item${index === 0 ? ' open' : ''}"><button class="accordion-trigger" type="button">${title}<i data-lucide="chevron-down" size="20"></i></button><div class="accordion-content"><div class="accordion-list">${rows.map(([label,value]) => `<div class="accordion-row"><b>${label}</b><span>${value}</span></div>`).join('')}</div></div></article>`).join('')}</div></div></section><section class="section"><div class="wrap"><h2>Điểm nổi bật và công dụng</h2><div class="feature-grid">${product.features.map(([title,text,icon]) => `<article class="feature"><i data-lucide="${icon}"></i><h3>${title}</h3><p>${text}</p></article>`).join('')}</div></div></section><section class="section"><div class="wrap"><h2>Trải nghiệm thực tế</h2><div class="insight-grid"><article class="insight-card"><h3>${product.name} trong đời sống</h3><p>${product.description} Thiết bị được định hướng cho trải nghiệm ổn định, dễ dùng và phù hợp với nhu cầu sử dụng lâu dài.</p><h4>Đang được yêu thích cho</h4><ul>${product.trends.map(trend => `<li>${trend}</li>`).join('')}</ul></article><article class="insight-card"><h3>Trong hộp có gì?</h3><ul><li>Điện thoại ${product.name}</li><li>Cáp sạc USB-C</li><li>Dụng cụ lấy SIM và tài liệu hướng dẫn</li><li>Ốp bảo vệ hoặc phụ kiện theo từng phiên bản</li></ul><h4>Chính sách hỗ trợ</h4><p>Bảo hành chính hãng, hỗ trợ cài đặt và tư vấn sử dụng tại NOVA Care.</p></article></div></div></section><section class="section"><div class="wrap"><h2>Phù hợp với ai?</h2><div class="usage"><article class="usage-card"><h3>Đối tượng sử dụng</h3><p>${product.for}</p></article><article class="usage-card"><h3>Điểm cần cân nhắc</h3><ul><li>Kiểm tra kích thước và trọng lượng trước khi mua.</li><li>Chọn dung lượng phù hợp với ảnh, video và ứng dụng.</li><li>Đối chiếu hệ điều hành với các thiết bị bạn đang dùng.</li></ul></article></div></div></section>`;
      document.querySelectorAll('.accordion-trigger').forEach(trigger => trigger.addEventListener('click', () => trigger.closest('.accordion-item').classList.toggle('open')));
      if (deepProfile) { detail.insertAdjacentHTML('beforeend', `<section class="section"><div class="wrap"><h2>${deepProfile.title}</h2><p class="hero-copy">${deepProfile.overview}</p><div class="detail-grid">${deepProfile.rows.map(([label, text]) => `<div class="detail-row"><b>${label}</b><span>${text}</span></div>`).join('')}</div><div class="insight-grid" style="margin-top:18px"><article class="insight-card"><h3>Trong hộp</h3><ul>${deepProfile.package.map(item => `<li>${item}</li>`).join('')}</ul></article><article class="insight-card"><h3>Lưu ý trước khi mua</h3><p>${deepProfile.note}</p></article></div></div></section>`); }
      const warranty = makeWarranty(product);
      detail.insertAdjacentHTML('beforeend', `<section class="section"><div class="wrap"><h2>Bảo hành ${product.name}</h2><div class="warranty-grid"><article class="warranty-card"><div class="warranty-badge"><i data-lucide="shield-check"></i> Chính sách bảo hành</div><h3>${warranty.terms}</h3><p>${warranty.support}</p></article><article class="warranty-card"><h3>Quy trình tiếp nhận</h3><p>${warranty.process}</p></article><article class="warranty-card"><h3>Được hỗ trợ</h3><ul>${warranty.covered.map(item => `<li>${item}</li>`).join('')}</ul></article><article class="warranty-card"><h3>Không áp dụng</h3><ul>${warranty.excluded.map(item => `<li>${item}</li>`).join('')}</ul></article></div></div></section>`);
      const reviews = makeReviews(model, product);
      detail.insertAdjacentHTML('beforeend', `<section class="section"><div class="wrap"><h2>Đánh giá ${product.name}</h2><div class="review-summary"><div class="review-score"><strong>${reviews.score}</strong><div class="stars" aria-label="${reviews.score} trên 5 sao">★★★★★</div><span>${reviews.count} đánh giá minh họa</span></div><div class="review-bars"><div class="review-bar"><span>5 ★</span><div class="bar-track"><div class="bar-fill" style="width:96%"></div></div><span>96%</span></div><div class="review-bar"><span>4 ★</span><div class="bar-track"><div class="bar-fill" style="width:3%"></div></div><span>3%</span></div><div class="review-bar"><span>3 ★</span><div class="bar-track"><div class="bar-fill" style="width:1%"></div></div><span>1%</span></div><div class="review-bar"><span>2 ★</span><div class="bar-track"><div class="bar-fill" style="width:0%"></div></div><span>0%</span></div><div class="review-bar"><span>1 ★</span><div class="bar-track"><div class="bar-fill" style="width:0%"></div></div><span>0%</span></div></div></div><div class="review-list">${reviews.reviews.map(([name, text, rating = 5]) => `<article class="review"><div class="review-head"><div><b>${escapeHtml(name)}</b><div class="stars">${'★'.repeat(Number(rating))}${'☆'.repeat(5 - Number(rating))}</div></div><span class="review-date">Đánh giá minh họa</span></div><p>${escapeHtml(text)}</p></article>`).join('')}</div><p class="review-note">Các đánh giá trên là nội dung minh họa cho giao diện demo, không phải dữ liệu đánh giá thực tế từ khách hàng.</p><form class="review-form" id="review-form"><h3>Viết đánh giá của bạn</h3><p>Chia sẻ trải nghiệm để giúp khách hàng khác dễ lựa chọn hơn.</p><div class="review-fields"><div class="review-field"><label for="review-name">Tên hiển thị</label><input id="review-name" required maxlength="40" placeholder="Nguyễn Văn A"></div><div class="review-field"><label for="review-rating">Đánh giá</label><select id="review-rating" required><option value="5">★★★★★ · Rất hài lòng</option><option value="4">★★★★☆ · Hài lòng</option><option value="3">★★★☆☆ · Bình thường</option><option value="2">★★☆☆☆ · Chưa hài lòng</option><option value="1">★☆☆☆☆ · Không hài lòng</option></select></div><div class="review-field full"><label for="review-text">Nhận xét</label><textarea id="review-text" required minlength="10" maxlength="500" placeholder="Bạn cảm nhận thế nào về sản phẩm?"></textarea></div></div><button class="review-submit" type="submit">Đăng đánh giá</button><p class="review-result" id="review-result"></p></form></div></section>`);
      document.querySelector('#review-form').addEventListener('submit', event => { event.preventDefault(); const name = document.querySelector('#review-name').value.trim(); const text = document.querySelector('#review-text').value.trim(); const rating = document.querySelector('#review-rating').value; const result = document.querySelector('#review-result'); if (text.length < 10) { result.textContent = 'Nhận xét cần có ít nhất 10 ký tự.'; return; } const submitted = JSON.parse(localStorage.getItem(`novaReviews:${model}`) || '[]'); submitted.unshift([name, text, rating]); localStorage.setItem(`novaReviews:${model}`, JSON.stringify(submitted)); result.textContent = 'Đã đăng đánh giá trên thiết bị này.'; event.currentTarget.reset(); const list = document.querySelector('.review-list'); const review = document.createElement('article'); review.className = 'review'; review.innerHTML = `<div class="review-head"><div><b>${escapeHtml(name)}</b><div class="stars">${'★'.repeat(Number(rating))}${'☆'.repeat(5 - Number(rating))}</div></div><span class="review-date">Vừa đăng</span></div><p>${escapeHtml(text)}</p>`; list.prepend(review); });
      document.querySelectorAll('img').forEach(image => { image.onerror = () => { image.onerror = null; image.src = 'https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=900&q=85'; }; });
      lucide.createIcons();
    }
  </script>
</body>
